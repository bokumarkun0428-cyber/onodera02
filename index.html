<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>のっけて！気仙沼</title>
<style>
  :root {
    --ink:    #1b2a3a;
    --paper:  #f6f4ef;
    --accent: #c8451f;
    --wave:   #2e6f8e;
    --light:  #e8f4fb;
    --green:  #2e7d52;
    --card:   #ffffff;
    --border: #ddd8d0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100svh;
  }

  /* ヘッダー */
  header {
    background: var(--ink);
    color: var(--paper);
    padding: 1.2rem 1rem 1rem;
    text-align: center;
  }
  header h1 { font-size: 1.5rem; letter-spacing: 0.05em; }
  header h1 span { color: #5bb8dc; }
  header p { font-size: 0.8rem; color: #8ab4c8; margin-top: 0.3rem; }

  /* タブ */
  .tabs {
    display: flex;
    border-bottom: 2px solid var(--border);
    background: var(--card);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab {
    flex: 1;
    padding: 0.85rem 0.5rem;
    text-align: center;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    background: none;
    color: #778;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: color 0.15s;
  }
  .tab.active { color: var(--wave); border-bottom-color: var(--wave); }
  .tab.active.want { color: var(--accent); border-bottom-color: var(--accent); }

  /* コンテンツ */
  .pane { display: none; padding: 1.2rem 1rem 5rem; max-width: 640px; margin: 0 auto; }
  .pane.active { display: block; }

  /* フォーム */
  .form-card {
    background: var(--card);
    border-radius: 10px;
    padding: 1.2rem;
    border: 1px solid var(--border);
    margin-bottom: 1.5rem;
  }
  .form-card h2 {
    font-size: 1rem;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 0.2em 0.6em;
    border-radius: 999px;
    color: #fff;
  }
  .badge.want { background: var(--accent); }
  .badge.offer { background: var(--green); }

  label { display: block; font-size: 0.82rem; color: #556; margin-bottom: 0.25rem; margin-top: 0.8rem; }
  input, textarea, select {
    width: 100%;
    padding: 0.55rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #fafaf8;
  }
  textarea { resize: vertical; min-height: 70px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

  .btn {
    display: block;
    width: 100%;
    margin-top: 1.1rem;
    padding: 0.75rem;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.8; }
  .btn.want  { background: var(--accent); }
  .btn.offer { background: var(--green); }

  /* 掲示板カード */
  .board-section { margin-bottom: 1.8rem; }
  .board-section h3 {
    font-size: 0.82rem;
    color: #778;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.7rem;
  }
  .post-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    margin-bottom: 0.75rem;
    position: relative;
  }
  .post-card.matched { opacity: 0.55; }
  .post-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.6rem;
  }
  .post-name { font-weight: 700; font-size: 0.95rem; }
  .post-time { font-size: 0.78rem; color: #889; margin-left: auto; }
  .route {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 0.45rem;
  }
  .route .from { color: var(--wave); }
  .route .to   { color: var(--accent); }
  .route .arrow { color: #aaa; font-size: 0.9rem; }
  .depart-time {
    font-size: 0.83rem;
    color: #556;
    margin-bottom: 0.4rem;
  }
  .comment {
    font-size: 0.85rem;
    color: #445;
    line-height: 1.7;
    margin-bottom: 0.6rem;
  }
  .match-btn {
    padding: 0.45rem 1rem;
    border: none;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    transition: opacity 0.15s;
  }
  .match-btn.want  { background: var(--green); }
  .match-btn.offer { background: var(--accent); }
  .match-btn:active { opacity: 0.75; }
  .matched-label {
    display: inline-block;
    font-size: 0.8rem;
    color: #889;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 0.35rem 0.8rem;
  }
  .empty { text-align:center; color:#aaa; font-size:0.9rem; padding: 2rem 0; }

  /* 通知トースト */
  #toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--ink);
    color: var(--paper);
    padding: 0.65rem 1.3rem;
    border-radius: 8px;
    font-size: 0.88rem;
    opacity: 0;
    transition: transform 0.3s, opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* 説明 */
  .intro {
    font-size: 0.85rem;
    color: #556;
    line-height: 1.8;
    background: var(--light);
    border-radius: 8px;
    padding: 0.85rem 1rem;
    margin-bottom: 1.2rem;
  }
</style>
</head>
<body>

<header>
  <h1>のっけて！<span>気仙沼</span></h1>
  <p>地域のちょっとした移動を、助け合いで。</p>
</header>

<div class="tabs">
  <button class="tab want active" onclick="showTab('want')">乗りたい</button>
  <button class="tab offer" onclick="showTab('offer')">乗せたい</button>
  <button class="tab" onclick="showTab('board')">掲示板</button>
</div>

<!-- 乗りたいフォーム -->
<div class="pane active" id="pane-want">
  <div class="intro">目的地と出発地を入力して投稿しましょう。近くにいるドライバーが声をかけてくれます。</div>
  <div class="form-card">
    <h2><span class="badge want">乗りたい</span> 移動リクエストを投稿</h2>
    <div class="row2">
      <div>
        <label>出発地</label>
        <input id="w-from" type="text" placeholder="例：本郷、唐桑">
      </div>
      <div>
        <label>目的地</label>
        <input id="w-to" type="text" placeholder="例：気仙沼駅、病院">
      </div>
    </div>
    <div class="row2">
      <div>
        <label>希望時刻</label>
        <input id="w-time" type="time">
      </div>
      <div>
        <label>名前（ニックネーム可）</label>
        <input id="w-name" type="text" placeholder="例：田中さん">
      </div>
    </div>
    <label>一言コメント</label>
    <textarea id="w-comment" placeholder="例：病院の帰りで荷物があります。どうぞよろしくお願いします。"></textarea>
    <button class="btn want" onclick="postWant()">乗せてください！と投稿する</button>
  </div>
</div>

<!-- 乗せたいフォーム -->
<div class="pane" id="pane-offer">
  <div class="intro">これから移動するルートを投稿しましょう。ルートが近い人を乗せてあげることができます。</div>
  <div class="form-card">
    <h2><span class="badge offer">乗せたい</span> ドライブルートを投稿</h2>
    <div class="row2">
      <div>
        <label>出発地</label>
        <input id="o-from" type="text" placeholder="例：気仙沼駅前">
      </div>
      <div>
        <label>向かう方向・目的地</label>
        <input id="o-to" type="text" placeholder="例：唐桑方面、本吉方面">
      </div>
    </div>
    <div class="row2">
      <div>
        <label>出発時刻</label>
        <input id="o-time" type="time">
      </div>
      <div>
        <label>名前（ニックネーム可）</label>
        <input id="o-name" type="text" placeholder="例：佐藤さん">
      </div>
    </div>
    <label>一言コメント</label>
    <textarea id="o-comment" placeholder="例：唐桑まで寄り道OKです。2〜3名乗れます。"></textarea>
    <button class="btn offer" onclick="postOffer()">乗せます！と投稿する</button>
  </div>
</div>

<!-- 掲示板 -->
<div class="pane" id="pane-board">
  <div class="board-section">
    <h3>乗りたい人</h3>
    <div id="board-want"></div>
  </div>
  <div class="board-section">
    <h3>乗せたい人</h3>
    <div id="board-offer"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const STORAGE_KEY = 'kesennuma-hitchhike-v1';

// デモ用初期データ
const DEMO = [
  { id:'d1', type:'want', name:'鈴木さん', from:'本郷', to:'気仙沼市立病院', departTime:'10:30', comment:'定期通院です。荷物は少なめです。どうぞよろしくお願いします。', status:'open', createdAt: Date.now()-1000*60*25 },
  { id:'d2', type:'offer', name:'阿部さん', from:'気仙沼駅前', to:'唐桑方面', departTime:'11:00', comment:'唐桑の実家まで向かいます。途中で寄り道も大丈夫です。3名まで乗れます。', status:'open', createdAt: Date.now()-1000*60*18 },
  { id:'d3', type:'want', name:'佐々木さん', from:'階上（はしかみ）', to:'気仙沼駅', departTime:'13:00', comment:'買い物帰りで少し荷物があります。よろしくお願いします。', status:'open', createdAt: Date.now()-1000*60*10 },
  { id:'d4', type:'offer', name:'小野寺さん', from:'気仙沼市内', to:'本吉・南三陸方面', departTime:'14:30', comment:'本吉まで用事があります。途中の方もどうぞ。', status:'open', createdAt: Date.now()-1000*60*5 },
];

function load() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) return JSON.parse(raw);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DEMO));
  return DEMO;
}
function save(posts) { localStorage.setItem(STORAGE_KEY, JSON.stringify(posts)); }

function timeAgo(ts) {
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return 'たった今';
  if (m < 60) return m + '分前';
  return Math.floor(m/60) + '時間前';
}

function showTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    const ids = ['want','offer','board'];
    t.classList.toggle('active', ids[i] === tab);
  });
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.getElementById('pane-' + tab).classList.add('active');
  if (tab === 'board') renderBoard();
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

function renderBoard() {
  const posts = load();
  const wants  = posts.filter(p => p.type === 'want');
  const offers = posts.filter(p => p.type === 'offer');

  document.getElementById('board-want').innerHTML  = renderCards(wants,  'want');
  document.getElementById('board-offer').innerHTML = renderCards(offers, 'offer');
}

function renderCards(posts, type) {
  if (!posts.length) return '<div class="empty">投稿がありません</div>';
  return posts.sort((a,b) => b.createdAt - a.createdAt).map(p => {
    const actionLabel = type === 'want' ? '乗せます' : '乗ります';
    const actionClass = type === 'want' ? 'want' : 'offer';
    const action = p.status === 'matched'
      ? `<span class="matched-label">マッチング済み</span>`
      : `<button class="match-btn ${actionClass}" onclick="match('${p.id}')">${actionLabel}</button>`;
    return `
    <div class="post-card ${p.status === 'matched' ? 'matched' : ''}">
      <div class="post-header">
        <span class="badge ${type}">${type === 'want' ? '乗りたい' : '乗せたい'}</span>
        <span class="post-name">${esc(p.name)}</span>
        <span class="post-time">${timeAgo(p.createdAt)}</span>
      </div>
      <div class="route">
        <span class="from">${esc(p.from)}</span>
        <span class="arrow">→</span>
        <span class="to">${esc(p.to)}</span>
      </div>
      <div class="depart-time">希望時刻：${esc(p.departTime)}</div>
      ${p.comment ? `<div class="comment">${esc(p.comment)}</div>` : ''}
      ${action}
    </div>`;
  }).join('');
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function match(id) {
  const posts = load();
  const p = posts.find(x => x.id === id);
  if (!p || p.status === 'matched') return;
  p.status = 'matched';
  save(posts);
  renderBoard();
  const msg = p.type === 'want'
    ? `${p.name} さんに「乗せます」と伝えました！`
    : `${p.name} さんに「乗ります」と伝えました！`;
  toast(msg);
}

function uid() { return 'p' + Date.now() + Math.random().toString(36).slice(2,6); }

function postWant() {
  const from = document.getElementById('w-from').value.trim();
  const to   = document.getElementById('w-to').value.trim();
  const time = document.getElementById('w-time').value;
  const name = document.getElementById('w-name').value.trim();
  const comment = document.getElementById('w-comment').value.trim();
  if (!from || !to || !name) { toast('出発地・目的地・名前を入力してください'); return; }
  const posts = load();
  posts.push({ id:uid(), type:'want', name, from, to, departTime:time||'未定', comment, status:'open', createdAt:Date.now() });
  save(posts);
  ['w-from','w-to','w-time','w-name','w-comment'].forEach(id => document.getElementById(id).value = '');
  toast('投稿しました！掲示板を確認してください');
  showTab('board');
}

function postOffer() {
  const from = document.getElementById('o-from').value.trim();
  const to   = document.getElementById('o-to').value.trim();
  const time = document.getElementById('o-time').value;
  const name = document.getElementById('o-name').value.trim();
  const comment = document.getElementById('o-comment').value.trim();
  if (!from || !to || !name) { toast('出発地・方向・名前を入力してください'); return; }
  const posts = load();
  posts.push({ id:uid(), type:'offer', name, from, to, departTime:time||'未定', comment, status:'open', createdAt:Date.now() });
  save(posts);
  ['o-from','o-to','o-time','o-name','o-comment'].forEach(id => document.getElementById(id).value = '');
  toast('投稿しました！掲示板を確認してください');
  showTab('board');
}
</script>
</body>
</html>
